<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Focus Rail circuit diagram</title>
  <desc id="desc">Seeed XIAO ESP32-C3 connected to a TMC2209 stepper driver, motor, and external motor supply.</desc>
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #172033; }
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 30px; font-weight: 700; }
      .subtitle { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; fill: #526077; }
      .component-title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 20px; font-weight: 700; }
      .block { fill: #f8fafc; stroke: #172033; stroke-width: 3; rx: 16; }
      .driver { fill: #eef6ff; }
      .power { fill: #fff8e8; }
      .pin { font-size: 15px; font-weight: 700; }
      .small { font-size: 13px; fill: #526077; }
      .label { font-size: 14px; font-weight: 700; }
      .wire { fill: none; stroke: #2c5aa0; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .uart { stroke: #8b5cf6; }
      .power-wire { stroke: #d23b3b; }
      .ground { stroke: #172033; }
      .motor-wire { stroke: #d97706; }
      .node { fill: #172033; }
      .warning { fill: #9a3412; font-size: 14px; font-weight: 700; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c5aa0"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="70" y="60" class="title">BLE Focus Rail — circuit diagram</text>
  <text x="70" y="88" class="subtitle">XIAO ESP32-C3 + TMC2209 • logic powered by USB • motor powered separately</text>

  <!-- Controller -->
  <rect x="70" y="150" width="330" height="490" class="block"/>
  <text x="235" y="190" text-anchor="middle" class="component-title">XIAO ESP32-C3</text>
  <text x="235" y="217" text-anchor="middle" class="small">USB-C powers the controller</text>
  <path d="M105 260 h90 v48 h-90 z M105 274 h-24 v20 h24" fill="#e5e7eb" stroke="#172033" stroke-width="2"/>
  <text x="210" y="290" class="small">USB-C 5 V</text>

  <g class="pin" text-anchor="end">
    <text x="380" y="354">D0 / GPIO 2</text>
    <text x="380" y="404">D1 / GPIO 3</text>
    <text x="380" y="454">D2 / GPIO 4</text>
    <text x="380" y="504">D3 / GPIO 5</text>
    <text x="380" y="554">D6 / GPIO 21 TX</text>
    <text x="380" y="604">D7 / GPIO 20 RX</text>
  </g>
  <g fill="#172033">
    <circle cx="400" cy="350" r="6"/><circle cx="400" cy="400" r="6"/>
    <circle cx="400" cy="450" r="6"/><circle cx="400" cy="500" r="6"/>
    <circle cx="400" cy="550" r="6"/><circle cx="400" cy="600" r="6"/>
  </g>
  <text x="90" y="605" class="pin">3V3</text><circle cx="70" cy="600" r="6" class="node"/>
  <text x="90" y="630" class="pin">GND</text><circle cx="70" cy="625" r="6" class="node"/>

  <!-- Driver -->
  <rect x="720" y="150" width="390" height="570" class="block driver"/>
  <text x="915" y="190" text-anchor="middle" class="component-title">TMC2209 carrier</text>
  <text x="915" y="216" text-anchor="middle" class="small">Verify carrier pinout and R_SENSE = 0.11 Ω</text>

  <g class="pin">
    <text x="742" y="354">STEP</text><text x="742" y="404">DIR</text>
    <text x="742" y="454">EN</text><text x="742" y="504">DIAG</text>
    <text x="742" y="579">PDN_UART</text>
    <text x="742" y="629">VIO</text><text x="742" y="679">GND</text>
  </g>
  <g fill="#172033">
    <circle cx="720" cy="350" r="6"/><circle cx="720" cy="400" r="6"/>
    <circle cx="720" cy="450" r="6"/><circle cx="720" cy="500" r="6"/>
    <circle cx="720" cy="575" r="6"/><circle cx="720" cy="625" r="6"/>
    <circle cx="720" cy="675" r="6"/>
  </g>

  <g class="pin" text-anchor="end">
    <text x="1088" y="304">A1</text><text x="1088" y="354">A2</text>
    <text x="1088" y="404">B1</text><text x="1088" y="454">B2</text>
    <text x="1088" y="554">VM</text><text x="1088" y="604">GND</text>
  </g>
  <g fill="#172033">
    <circle cx="1110" cy="300" r="6"/><circle cx="1110" cy="350" r="6"/>
    <circle cx="1110" cy="400" r="6"/><circle cx="1110" cy="450" r="6"/>
    <circle cx="1110" cy="550" r="6"/><circle cx="1110" cy="600" r="6"/>
  </g>

  <!-- Logic wires -->
  <path d="M400 350 H720" class="wire"/>
  <path d="M400 400 H720" class="wire"/>
  <path d="M400 450 H720" class="wire"/>
  <path d="M400 500 H720" class="wire" marker-start="url(#arrow-blue)"/>
  <text x="540" y="340" class="label">STEP</text>
  <text x="540" y="390" class="label">DIR</text>
  <text x="540" y="440" class="label">ENABLE (active low)</text>
  <text x="540" y="490" class="label">STALL / DIAG</text>

  <!-- UART one-wire join -->
  <path d="M400 600 H650 V575 H720" class="wire uart" marker-end="url(#arrow-purple)"/>
  <path d="M400 550 H472" class="wire uart"/>
  <path d="M472 550 l12 -12 l18 24 l18 -24 l18 24 l18 -24 l18 12" class="wire uart" stroke-width="3"/>
  <path d="M580 550 H650 V575" class="wire uart"/>
  <circle cx="650" cy="575" r="7" fill="#8b5cf6"/>
  <text x="487" y="528" class="label" fill="#6d28d9">1 kΩ</text>
  <text x="455" y="625" class="small">RX direct; TX through resistor</text>

  <!-- 3V3 and common ground -->
  <path d="M70 600 H35 V750 H660 V625 H720" class="wire power-wire"/>
  <text x="420" y="740" class="label" fill="#b91c1c">3.3 V logic</text>
  <path d="M70 625 H50 V785 H1180" class="wire ground"/>
  <path d="M680 785 V675 H720" class="wire ground"/>
  <path d="M1145 785 V600 H1110" class="wire ground"/>
  <circle cx="680" cy="785" r="7" class="node"/><circle cx="1145" cy="785" r="7" class="node"/>
  <text x="420" y="812" class="label">COMMON GROUND</text>

  <!-- Address straps -->
  <path d="M840 720 V785 M920 720 V785" class="wire ground" stroke-width="3"/>
  <circle cx="840" cy="785" r="6" class="node"/><circle cx="920" cy="785" r="6" class="node"/>
  <text x="840" y="704" text-anchor="middle" class="pin">MS1</text>
  <text x="920" y="704" text-anchor="middle" class="pin">MS2</text>
  <text x="880" y="838" text-anchor="middle" class="small">MS1 + MS2 LOW → UART address 0</text>

  <!-- Motor -->
  <circle cx="1260" cy="375" r="96" fill="#fff7ed" stroke="#172033" stroke-width="3"/>
  <circle cx="1260" cy="375" r="43" fill="none" stroke="#d97706" stroke-width="5" stroke-dasharray="10 7"/>
  <text x="1260" y="370" text-anchor="middle" class="component-title">Bipolar</text>
  <text x="1260" y="397" text-anchor="middle" class="component-title">stepper</text>
  <path d="M1110 300 H1190 V327" class="wire motor-wire"/>
  <path d="M1110 350 H1172 V355" class="wire motor-wire"/>
  <path d="M1110 400 H1172 V395" class="wire motor-wire"/>
  <path d="M1110 450 H1190 V423" class="wire motor-wire"/>
  <text x="1160" y="270" class="small">Keep paired coils together</text>

  <!-- Motor supply and capacitor -->
  <rect x="1180" y="535" width="170" height="155" class="block power"/>
  <text x="1265" y="570" text-anchor="middle" class="component-title">Motor supply</text>
  <text x="1265" y="598" text-anchor="middle" class="pin">12 V DC</text>
  <text x="1200" y="642" class="pin">+</text><circle cx="1180" cy="637" r="6" class="node"/>
  <text x="1200" y="673" class="pin">−</text><circle cx="1180" cy="668" r="6" class="node"/>
  <path d="M1180 637 H1150 V550 H1110" class="wire power-wire"/>
  <path d="M1180 668 H1145" class="wire ground"/>

  <path d="M1135 550 H1160 V565" class="wire power-wire" stroke-width="3"/>
  <path d="M1145 600 H1160 V585" class="wire ground" stroke-width="3"/>
  <line x1="1145" y1="565" x2="1175" y2="565" stroke="#172033" stroke-width="4"/>
  <line x1="1149" y1="585" x2="1171" y2="585" stroke="#172033" stroke-width="4"/>
  <text x="1175" y="505" text-anchor="middle" class="small">220–470 µF / 25 V electrolytic</text>
  <text x="1131" y="563" class="label">+</text>

  <!-- Safety notes -->
  <rect x="70" y="850" width="1280" height="2" fill="#e2e8f0"/>
  <text x="70" y="880" class="warning">Power off before connecting the motor. Never feed 12 V into the XIAO. Confirm your carrier's VIO, UART jumper, and pinout.</text>
</svg>
