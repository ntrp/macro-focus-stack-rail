<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#123c50" />
    <title>Focus Rail</title>
  </head>
  <body>
    <header>
      <p class="eyebrow">Camera motion control</p>
      <h1>Focus Rail</h1>
    </header>

    <main>
      <section class="card connection-card" aria-live="polite">
        <div>
          <h2 id="connection-label">Not connected</h2>
          <p id="detail-label" class="muted">Tap Connect to find FocusRail</p>
        </div>
        <button id="connect-button" class="secondary">Connect</button>
      </section>

      <section class="card" aria-live="polite">
        <p class="eyebrow">Position</p>
        <p id="position-label" class="position">— mm</p>
        <div class="status-row">
          <span id="state-label" class="pill">State: unknown</span>
          <span id="homed-label" class="pill">Not homed</span>
        </div>
        <p id="error-label" class="error" role="alert" hidden></p>
      </section>

      <div class="button-row action-row">
        <button id="home-button" class="primary" disabled>Home rail</button>
        <button id="zero-button" class="secondary" disabled>Set zero</button>
      </div>

      <section class="card">
        <h2>Incremental move</h2>
        <label for="move-speed">Feed rate in millimetres per minute</label>
        <input id="move-speed" inputmode="decimal" type="text" value="120" />
        <div class="step-grid" aria-label="Incremental movement">
          <button class="secondary step-button" data-step="-10" disabled>
            −10 mm
          </button>
          <button class="secondary step-button" data-step="10" disabled>
            +10 mm
          </button>
          <button class="secondary step-button" data-step="-1" disabled>
            −1 mm
          </button>
          <button class="secondary step-button" data-step="1" disabled>
            +1 mm
          </button>
          <button class="secondary step-button" data-step="-0.1" disabled>
            −0.1 mm
          </button>
          <button class="secondary step-button" data-step="0.1" disabled>
            +0.1 mm
          </button>
          <button class="secondary step-button" data-step="-0.01" disabled>
            −0.01 mm
          </button>
          <button class="secondary step-button" data-step="0.01" disabled>
            +0.01 mm
          </button>
        </div>
      </section>

      <section class="card">
        <h2>Absolute move</h2>
        <label for="absolute-position">Target position in millimetres</label>
        <input
          id="absolute-position"
          inputmode="decimal"
          type="text"
          value="0"
        />
        <button id="absolute-move" class="primary full" disabled>
          Move to position
        </button>
      </section>

      <button id="stop-button" class="danger full" disabled>Stop</button>
      <p class="footnote">
        Position is open-loop. Home again after a stall, skipped step, or power
        loss.
      </p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
